name: Release Production
run-name: Release Production ${{ github.event.inputs.version }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: The git tag for the version to recursively copy to the top level folder
        required: true
env:
  BUCKET: models-resources
  PREFIX: cloud-file-manager
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::612297603577:role/cloud-file-manager
          aws-region: us-east-1
      - run: >
          aws s3 cp
          s3://${{ env.BUCKET }}/${{ env.PREFIX }}/version/${{ github.event.inputs.version }}/
          s3://${{ env.BUCKET }}/${{ env.PREFIX }}/
          --recursive
